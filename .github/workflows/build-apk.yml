name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Mendukung file di paling atas repo (rata) maupun folder www/ dan assets/.
      - name: Arrange project files
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f config.js ]; then cp config.js www/config.js; fi
          cp icon-*.png splash*.png assets/ 2>/dev/null || true
          test -f www/index.html

      - name: Write Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf "window.EMBER_CONFIG = { url: '%s', anonKey: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > www/config.js

      - name: Install dependencies
        run: npm install

      # Font ikut dibungkus ke dalam aplikasi supaya tampil sama saat offline.
      - name: Bundle fonts
        run: |
          npm install --no-save --no-package-lock @fontsource-variable/plus-jakarta-sans @fontsource-variable/bricolage-grotesque
          mkdir -p www/fonts
          P=node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2
          B=node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2
          if cp "$P" www/fonts/plus-jakarta.woff2 && cp "$B" www/fonts/bricolage.woff2; then
            sed -i '/fonts.googleapis.com/d;/fonts.gstatic.com/d' www/index.html
          else
            echo "::warning::Font tidak ditemukan, aplikasi memakai font sistem."
          fi

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      # versionCode naik di setiap build, supaya APK baru bisa dipasang menimpa yang lama.
      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Generate icons and splash
        continue-on-error: true
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0a0607' --splashBackgroundColor '#0a0607'
          else
            echo "::warning::assets/icon-only.png tidak ada, memakai ikon bawaan."
          fi

      # Kunci debug yang sama di setiap build, jadi APK baru bisa menimpa APK lama tanpa uninstall.
      - name: Use fixed debug key
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          else
            echo "::warning::debug.keystore tidak ada, kunci debug acak dipakai (APK lama harus di-uninstall dulu)."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: ember-fitness-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Hanya jalan kalau secret kunci rilis sudah dibuat (lihat README).
      - name: Build signed release (APK dan AAB)
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p "$GITHUB_WORKSPACE/release"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$GITHUB_WORKSPACE/release/ember-fitness-release.apk" "$RUNNER_TEMP/aligned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/release/ember-fitness.aab"
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KS_PASS -keypass:env KEY_PASS "$GITHUB_WORKSPACE/release/ember-fitness.aab" "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload signed release
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ember-fitness-release
          path: release/
